name: testRigor E2E on OpenCart (localhost)

on:
  push:
    branches: ["**"]
  workflow_dispatch:

jobs:
  e2e:
    runs-on: ubuntu-latest
    env:
      TESTRIGOR_SUITE_ID: ${{ vars.TESTRIGOR_SUITE_ID }}

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      # 1) Create docker-compose.yml if the repo doesn't provide one
      - name: Generate docker-compose.yml if missing
        shell: bash
        run: |
          set -euo pipefail
          if [ ! -f docker-compose.yml ]; then
            echo "No docker-compose.yml found. Writing a default one…"
            cat > docker-compose.yml <<'YAML'
            services:
              db:
                image: mariadb:10.6
                environment:
                  MARIADB_ROOT_PASSWORD: root
                  MARIADB_DATABASE: opencart
                  MARIADB_USER: oc
                  MARIADB_PASSWORD: ocpass
                ports:
                  - "3306:3306"
                healthcheck:
                  test: ["CMD-SHELL","mysqladmin ping -h 127.0.0.1 -uroot -proot --silent || exit 1"]
                  interval: 10s
                  timeout: 5s
                  retries: 10

              opencart:
                image: bitnami/opencart:latest
                environment:
                  OPENCART_HOST: localhost
                  OPENCART_USERNAME: admin
                  OPENCART_PASSWORD: admin123
                  OPENCART_EMAIL: admin@example.com
                  MARIADB_HOST: db
                  MARIADB_PORT_NUMBER: 3306
                  MARIADB_DATABASE: opencart
                  MARIADB_USER: oc
                  MARIADB_PASSWORD: ocpass
                  ALLOW_EMPTY_PASSWORD: "yes"
                depends_on:
                  - db
                ports:
                  - "8080:8080"
            YAML
          fi

      # 2) Normalize the compose file (BOM/CRLF & remove legacy 'version')
      - name: Normalize docker-compose.yml (BOM/CRLF & legacy version)
        if: ${{ hashFiles('docker-compose.yml') != '' }}
        shell: bash
        run: |
          set -euo pipefail
          # Remove BOM if present
          sed -i '1s/^\xEF\xBB\xBF//' docker-compose.yml || true
          # Convert CRLF to LF
          sed -i 's/\r$//' docker-compose.yml
          # Drop any legacy "version:" line; compose v2 ignores it anyway
          awk '!/^[[:space:]]*version[[:space:]]*:/ {print}' docker-compose.yml > _dc.yml
          mv _dc.yml docker-compose.yml
          echo "----- head of docker-compose.yml -----"
          sed -n '1,120p' docker-compose.yml
          echo "--------------------------------------"

      # 3) Validate compose; if invalid, replace with a known-good default
      - name: Validate compose (fallback to default if invalid)
        shell: bash
        run: |
          set -euo pipefail
          if ! docker compose -f docker-compose.yml config >/dev/null 2>&1; then
            echo "::warning::Provided docker-compose.yml failed validation; replacing with default."
            cat > docker-compose.yml <<'YAML'
            services:
              db:
                image: mariadb:10.6
                environment:
                  MARIADB_ROOT_PASSWORD: root
                  MARIADB_DATABASE: opencart
                  MARIADB_USER: oc
                  MARIADB_PASSWORD: ocpass
                ports:
                  - "3306:3306"
                healthcheck:
                  test: ["CMD-SHELL","mysqladmin ping -h 127.0.0.1 -uroot -proot --silent || exit 1"]
                  interval: 10s
                  timeout: 5s
                  retries: 10

              opencart:
                image: bitnami/opencart:latest
                environment:
                  OPENCART_HOST: localhost
                  OPENCART_USERNAME: admin
                  OPENCART_PASSWORD: admin123
                  OPENCART_EMAIL: admin@example.com
                  MARIADB_HOST: db
                  MARIADB_PORT_NUMBER: 3306
                  MARIADB_DATABASE: opencart
                  MARIADB_USER: oc
                  MARIADB_PASSWORD: ocpass
                  ALLOW_EMPTY_PASSWORD: "yes"
                depends_on:
                  - db
                ports:
                  - "8080:8080"
            YAML
          fi

      # 4) Bring the stack up
      - name: Start OpenCart (docker-compose)
        shell: bash
        run: |
          set -euo pipefail
          docker compose -f docker-compose.yml up -d --remove-orphans
          docker compose -f docker-compose.yml ps

      # 5) Detect which port is live and export LOCAL_BASE_URL
      - name: Detect OpenCart URL
        shell: bash
        run: |
          if curl -fsSI http://localhost:8080 >/dev/null; then
            echo "LOCAL_BASE_URL=http://localhost:8080" >> "$GITHUB_ENV"
          else
            echo "LOCAL_BASE_URL=http://localhost" >> "$GITHUB_ENV"
          fi
          echo "Using \$LOCAL_BASE_URL=$(grep LOCAL_BASE_URL \"$GITHUB_ENV\" | cut -d= -f2-)"

      # 6) Wait until the site is reachable
      - name: Wait for OpenCart to be reachable
        shell: bash
        run: |
          set -e
          for i in {1..90}; do
            if curl -fsS -o /dev/null -L "$LOCAL_BASE_URL"; then
              echo "OpenCart is up at $LOCAL_BASE_URL"; exit 0
            fi
            echo "Waiting for OpenCart... ($i/90)"; sleep 3
          done
          echo "::group::Recent container logs"
          docker compose logs --no-color --tail=200 || true
          echo "::endgroup::"
          exit 1

      - name: Verify HTTP headers (sanity)
        run: curl -LI "$LOCAL_BASE_URL" || true

      # 7) Install & verify testRigor CLI
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install testRigor CLI
        run: npm i -g testrigor-cli

      - name: Verify CLI is installed
        run: |
          which testrigor || true
          testrigor --version || true
          npx -y testrigor-cli --version

      # 8) Trigger suite
      - name: Trigger testRigor suite against localhost
        env:
          TESTRIGOR_CI_TOKEN: ${{ secrets.TESTRIGOR_CI_TOKEN }}
        run: |
          echo "Suite ID: $TESTRIGOR_SUITE_ID"
          echo "URL:      $LOCAL_BASE_URL"
          npx -y testrigor-cli test-suite run "$TESTRIGOR_SUITE_ID" \
            --token "$TESTRIGOR_CI_TOKEN" \
            --localhost --url "$LOCAL_BASE_URL" \
            --verbose
